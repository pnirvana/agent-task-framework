<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATF</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="themes/macchiato.css" id="theme">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <button id="explorer-toggle" class="icon" title="show / hide the Explorer">☰</button>
  <span class="brand">Agent Task Framework</span>
  <button id="palette-open" class="search" title="search plans, tasks, documents, agents and commands"><span>Search plans, tasks, files, agents…</span><kbd>⌘K</kbd></button>
  <span class="grow"></span>
  <button id="needs-count" class="pill" title="what needs you"></button>
  <button id="bell" class="icon"></button>
  <button id="help-open" class="icon" title="keys and help">?</button>
  <span id="conn" class="conn" title="connection to the server">●</span>
</header>

<div id="ws">
  <aside id="explorer" class="panel">
    <header><span>Explorer</span></header>
    <nav id="tree" class="body" aria-label="projects, plans and agents"></nav>
  </aside>
  <div class="gutter v" data-col="explorer"></div>

  <section id="leftcol">
    <section id="needs" class="panel">
      <header><span>Needs you</span><span id="needs-n" class="n"></span></header>
      <div class="body"></div>
    </section>
    <div class="gutter h" data-row="needs"></div>
    <section id="work" class="panel">
      <header>
        <nav id="work-tabs" role="tablist"></nav>
        <select id="work-filter" title="which plans the list shows"></select>
      </header>
      <div class="body"></div>
    </section>
  </section>
  <div class="gutter v" data-col="leftcol"></div>

  <main id="editor"></main>
  <div class="gutter v" data-col="inflight" data-side="right"></div>

  <aside id="inflight" class="panel">
    <header><span>In flight</span></header>
    <div class="body"></div>
  </aside>
</div>

<div class="gutter h" id="term-gutter" data-row="terminals"></div>
<section id="terminals" class="panel">
  <header>
    <nav id="ptabs"></nav>
    <span class="grow"></span>
    <button id="term-to-editor" class="icon" title="open this terminal as an editor tab">⧉</button>
    <button id="term-max" class="icon" title="terminals taller / back">⤢</button>
    <button id="term-hide" class="icon" title="hide the terminals (ctrl+`)">▁</button>
  </header>
  <div id="terms"></div>
</section>

<div id="toast" role="status"></div>
<dialog id="help"></dialog>
<div id="palette" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
