<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATF</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="themes/macchiato.css" id="theme">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <span class="brand">Agent Task Framework</span>
  <button id="palette-open" class="search" title="search plans, tasks, documents, agents and commands"><span>Search plans, tasks, files, agents…</span><kbd>⌘K</kbd></button>
  <span class="grow"></span>
  <span id="summary" class="summary"></span>
  <button id="bell" class="icon"></button>
  <button id="help-open" class="icon" title="keys and help">?</button>
  <span id="conn" class="conn" title="connection to the server">●</span>
</header>

<div id="cockpit">
  <nav id="rail" aria-label="panels: show and hide"></nav>
  <section id="plans" class="panel">
    <header><span>Plans</span><span class="grow"></span><button class="icon hide" data-hide="plans" title="hide the plans (alt+shift+1)">–</button></header>
    <div class="body"></div>
  </section>
  <div class="gutter v" data-col="plans"></div>
  <div id="leftcol">
    <section id="needs" class="panel">
      <header><span>Needs you</span><span id="needs-n" class="n"></span><span class="grow"></span><span class="sum">now</span><button class="icon hide" data-hide="needs" title="hide Needs you (alt+shift+2)">–</button></header>
      <div class="body"></div>
    </section>
    <div class="gutter h" data-row="needs"></div>
    <section id="todos" class="panel">
      <header><span>Your tasks</span><span id="todos-n" class="n"></span><span class="grow"></span><span class="sum">eventually</span><button class="icon hide" data-hide="todos" title="hide Your tasks (alt+shift+3)">–</button></header>
      <div class="body"></div>
    </section>
  </div>
  <div class="gutter v" data-col="needs"></div>
  <section id="flight" class="panel">
    <header><span>In flight</span><span class="grow"></span><span id="flight-sum" class="sum"></span></header>
    <div class="body"></div>
    <aside id="drawer" aria-label="details"></aside>
  </section>
</div>

<div class="gutter h" id="term-gutter" data-row="terminals"></div>
<section id="terminals" class="panel">
  <div id="term-main">
    <header id="term-h">
      <span id="term-title"></span>
      <span class="grow"></span>
      <button id="term-max" class="icon" title="terminal taller / back">⤢</button>
      <button id="term-hide" class="icon" title="hide the terminal (ctrl+` · alt+shift+4; the rail brings it back)">–</button>
    </header>
    <div id="tbody"></div>
  </div>
  <nav id="term-list" aria-label="terminals, per plan"></nav>
</section>

<div id="toast" role="status"></div>
<dialog id="help"></dialog>
<div id="palette" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
